<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DashTron Smartgauge – เปลี่ยนผู้ถือลิขสิทธิ์</title>
<style>
  :root{
    --bg:#000; --card:rgba(12,18,26,.84); --line:#26323f; --text:#e8eef5;
    --muted:#93a1b1; --accent:#18c6ff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Sarabun","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;align-items:center;justify-content:center;padding:16px}
  .card{width:min(640px,100%);background:var(--card);border:1px solid var(--line);
    border-radius:18px;padding:40px 28px;text-align:center}
  .icon{font-size:2.6rem;line-height:1;margin-bottom:14px}
  h1{margin:0 0 14px;font-size:clamp(1.4rem,5vw,1.9rem);letter-spacing:.04em}
  h1 span{color:var(--accent)}
  p{margin:0 0 12px;color:var(--muted);font-size:1.05rem;line-height:1.7}
  .btn{display:inline-block;margin-top:14px;background:var(--accent);color:#04202b;
    text-decoration:none;font-weight:700;border-radius:10px;padding:13px 24px;font-size:1.05rem}
  .btn:hover{filter:brightness(1.1)}
  .url{margin-top:16px;font-size:.9rem;color:var(--muted);word-break:break-all}
  .url a{color:var(--accent)}
</style>
</head>
<body>
  <main class="card">
    <div class="icon">📢</div>
    <h1><span>DashTron</span> Smartgauge</h1>
    <p>DashTron Smartgauge ได้เปลี่ยนผู้ถือลิขสิทธิ์แล้ว</p>
    <p>ติดตามข่าวสารและติดตั้งโปรแกรมได้ที่ผู้ถือลิขสิทธิ์ท่านใหม่</p>
    <a class="btn" href="https://dashtron69.github.io/webflash/">ไปที่เว็บผู้ถือลิขสิทธิ์</a>
    <div class="url"><a href="https://dashtron69.github.io/webflash/">https://dashtron69.github.io/webflash/</a></div>
  </main>
</body>
</html>
